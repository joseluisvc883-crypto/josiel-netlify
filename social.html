<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    .container {
      text-align: center;
      color: #f8fafc;
      z-index: 10;
      position: relative;
      padding: 40px;
    }
    .title {
      font-size: 72px;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(135deg, #60a5fa, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }
    .subtitle {
      font-size: 42px;
      font-weight: 300;
      margin: 20px 0 10px 0;
      color: #94a3b8;
    }
    .date {
      font-size: 28px;
      color: #f59e0b;
      font-weight: 600;
      margin: 0;
    }
    .heart {
      font-size: 60px;
      animation: pulse 2s ease-in-out infinite;
      display: inline-block;
      margin: 20px 0;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }
    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(60, 130, 246, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="container">
    <div class="heart">❤️</div>
    <h1 class="title">EL INICIO A LA FELICIDAD</h1>
    <p class="subtitle">José & Daniel</p>
    <p class="date">13 de Mayo • Playa de las Tortugas</p>
  </div>
</body>
</html>
